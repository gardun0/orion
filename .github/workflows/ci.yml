name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wagoid/commitlint-github-action@v6

  build:
    name: clippy, check & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang mold pkg-config cmake \
            libasound2-dev libfontconfig-dev libwayland-dev \
            libx11-xcb-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: check
        run: cargo check --workspace --all-targets --locked

      # Unit tests only. The live PipeWire integration tests in
      # tests/pipewire_backend.rs are #[ignore]d and run manually with
      # `cargo test -- --ignored` on a machine with a PipeWire session.
      - name: test
        run: cargo test --workspace --locked

  packaging-metadata:
    name: Validate packaging metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
      - name: Validate desktop entry
        run: desktop-file-validate assets/linux/io.github.gardun0.orion.desktop
      - name: Validate AppStream metainfo
        run: appstreamcli validate --no-net assets/linux/io.github.gardun0.orion.metainfo.xml
