name: Release

# A single workflow on purpose: tags/releases created by release-please use
# GITHUB_TOKEN, and events produced by GITHUB_TOKEN do not trigger other
# workflows. Packaging therefore lives in the same run, gated on the
# release-please outputs.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Re-package an existing release, e.g. 0.1.2 (skips release-please)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve released version
        id: version
        if: steps.release.outputs.releases_created == 'true'
        run: echo "version=$(jq -r 'to_entries[0].value' .release-please-manifest.json)" >> "$GITHUB_OUTPUT"

  package:
    name: Build & package (${{ matrix.os }})
    needs: release-please
    if: >-
      (github.event_name == 'push' && needs.release-please.outputs.releases_created == 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: dist-linux
          - os: windows-latest
            artifact: dist-windows
          - os: macos-latest
            artifact: dist-macos
    # ubuntu-24.04: the pipewire crate needs PipeWire 1.x headers (22.04 ships
    # 0.3.48, which fails to build). Binary floor: glibc 2.39, PipeWire 1.0.
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.release-please.outputs.version }}

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang mold pkg-config cmake curl ca-certificates \
            libasound2-dev libfontconfig-dev libwayland-dev \
            libx11-xcb-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Compiled from source: the prebuilt binaries of these tools target a
      # newer glibc than some of our build images ship.
      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Strip binary
        if: runner.os != 'Windows'
        run: strip "target/release/orion" || true

      # --- Linux packages -----------------------------------------------------
      - name: Assemble tarball
        if: runner.os == 'Linux'
        run: |
          staging="target/release-staging"
          mkdir -p "$staging" dist
          cp target/release/orion "$staging/orion"
          cp assets/linux/io.github.gardun0.orion.desktop "$staging/"
          cp assets/linux/io.github.gardun0.orion.metainfo.xml "$staging/"
          cp assets/app-icon/io.github.gardun0.orion.svg "$staging/"
          cp assets/app-icon/io.github.gardun0.orion-*.png "$staging/"
          cp LICENSE README.md "$staging/"
          tar -czf "dist/orion-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz" -C "$staging" .

      - name: Build Debian package
        if: runner.os == 'Linux'
        run: |
          cargo deb --no-build
          cp target/debian/*.deb "dist/orion_${VERSION}_amd64.deb"

      - name: Build RPM package
        if: runner.os == 'Linux'
        run: |
          cargo generate-rpm
          cp target/generate-rpm/*.rpm "dist/orion-${VERSION}-1.x86_64.rpm"

      - name: Build AppImage
        if: runner.os == 'Linux'
        run: packaging/appimage/build-appimage.sh dist

      # --- Windows package ----------------------------------------------------
      - name: Build zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Force -Path target/release/orion.exe, LICENSE, README.md `
            -DestinationPath "dist/orion-v${env:VERSION}-x86_64-pc-windows-msvc.zip"

      # --- macOS package ------------------------------------------------------
      - name: Build Orion.app zip (macOS)
        if: runner.os == 'macOS'
        run: packaging/macos/build-app.sh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 7

  publish:
    name: Upload release assets
    needs: [release-please, package]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.release-please.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Upload assets to GitHub Release
        run: gh release upload "v${VERSION}" dist/* --clobber
      # Keep the merged artifacts around for the AUR job.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
      - name: Mark pre-1.0 releases as prerelease
        if: startsWith(env.VERSION, '0.')
        run: gh release edit "v${VERSION}" --prerelease

  aur:
    name: Publish to AUR (orion-bin)
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.release-please.outputs.version }}
    steps:
      # The job skips cleanly until the AUR_SSH_PRIVATE_KEY secret exists.
      - name: Check AUR credentials
        id: guard
        run: |
          if [ -z "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY not set; skipping AUR publish"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare environment
        if: steps.guard.outputs.available == 'true'
        run: |
          pacman -Sy --noconfirm --needed openssh git >/dev/null
          useradd -m builder
          mkdir -p /home/builder/.ssh
          echo "${AUR_SSH_PRIVATE_KEY}" > /home/builder/.ssh/id_ed25519
          chmod 600 /home/builder/.ssh/id_ed25519
          ssh-keyscan aur.archlinux.org >> /home/builder/.ssh/known_hosts
          chown -R builder:builder /home/builder/.ssh

      - uses: actions/checkout@v4
        if: steps.guard.outputs.available == 'true'

      - uses: actions/download-artifact@v4
        if: steps.guard.outputs.available == 'true'
        with:
          name: dist
          path: dist

      - name: Checkout AUR repository
        if: steps.guard.outputs.available == 'true'
        run: |
          runuser -u builder -- git clone ssh://aur@aur.archlinux.org/orion-bin.git /home/builder/orion-bin

      - name: Render PKGBUILD and .SRCINFO
        if: steps.guard.outputs.available == 'true'
        env:
          GIT_AUTHOR_NAME: ${{ vars.AUR_GIT_NAME || 'orion-ci' }}
          GIT_AUTHOR_EMAIL: ${{ vars.AUR_GIT_EMAIL || 'ci@gardun0.invalid' }}
          GIT_COMMITTER_NAME: ${{ vars.AUR_GIT_NAME || 'orion-ci' }}
          GIT_COMMITTER_EMAIL: ${{ vars.AUR_GIT_EMAIL || 'ci@gardun0.invalid' }}
        run: |
          set -euo pipefail
          repo=/home/builder/orion-bin
          tarball="orion-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          sha256="$(awk -v f="$tarball" '$2 == f { print $1 }' dist/SHA256SUMS.txt)"
          test -n "$sha256"
          cp packaging/aur/PKGBUILD "$repo/PKGBUILD"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" "$repo/PKGBUILD"
          sed -i "s/^pkgrel=.*/pkgrel=1/" "$repo/PKGBUILD"
          sed -i "s/^sha256sums=.*/sha256sums=('${sha256}')/" "$repo/PKGBUILD"
          chown -R builder:builder "$repo"
          cd "$repo"
          runuser -u builder -- sh -c 'makepkg --printsrcinfo > .SRCINFO'
          runuser -u builder -- git add PKGBUILD .SRCINFO
          runuser -u builder -- git -c user.name="${GIT_AUTHOR_NAME}" -c user.email="${GIT_AUTHOR_EMAIL}" \
            commit -m "chore: release v${VERSION}"
          runuser -u builder -- git push
