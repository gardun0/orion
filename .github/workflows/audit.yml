name: Audit

on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - crates/orion-dsp/Cargo.toml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - crates/orion-dsp/Cargo.toml
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    name: advisories, bans, licenses & sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
